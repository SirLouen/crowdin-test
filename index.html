<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crowdin Translation Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f5f5f5;
      color: #1a1a2e;
    }
    header {
      background: #16213e;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lang-switcher {
      display: flex;
      gap: 0.5rem;
    }
    .lang-switcher a {
      color: white;
      text-decoration: none;
      padding: 0.4rem 1rem;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.3);
      cursor: pointer;
      transition: background 0.2s;
    }
    .lang-switcher a:hover { background: rgba(255,255,255,0.1); }
    .lang-switcher a.active {
      background: #e94560;
      border-color: #e94560;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      gap: 1.5rem;
    }
    h1 { font-size: 2rem; color: #16213e; }
    .greeting { font-size: 1.25rem; color: #333; }
    .description {
      max-width: 500px;
      color: #666;
      line-height: 1.6;
    }
    .current-locale {
      display: inline-block;
      background: #16213e;
      color: white;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    footer {
      background: #16213e;
      color: rgba(255,255,255,0.7);
      padding: 1rem 2rem;
      text-align: center;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <span id="switch-label">Switch Language</span>
    <div class="lang-switcher">
      <a id="lang-en" onclick="switchLang('en')" class="active">EN</a>
      <a id="lang-es" onclick="switchLang('es')">ES</a>
    </div>
  </header>

  <main>
    <h1 id="page-title">Welcome to StudioCMS</h1>
    <p class="greeting" id="greeting">Hello! This is a translation test.</p>
    <p class="description" id="description">This application demonstrates how Crowdin translations work with two-letter locale codes.</p>
    <p class="note" id="note">Current locale:</p>
    <span class="current-locale" id="locale-badge">en</span>
  </main>

  <footer>
    <p id="footer">Built with StudioCMS — Open Source CMS</p>
  </footer>

  <script>
    const translations = {};
    let currentLang = 'en';

    async function loadTranslation(lang) {
      if (translations[lang]) return translations[lang];
      const res = await fetch(`translations/${lang}.json`);
      const data = await res.json();
      translations[lang] = data;
      return data;
    }

    function applyTranslation(data, lang) {
      const t = data.translations;
      document.getElementById('page-title').textContent = t['page-title'];
      document.getElementById('greeting').textContent = t['greeting'];
      document.getElementById('description').textContent = t['description'];
      document.getElementById('switch-label').textContent = t['switch-language'];
      document.getElementById('note').textContent = t['note'];
      document.getElementById('footer').textContent = t['footer'];
      document.getElementById('locale-badge').textContent = lang;
      document.documentElement.lang = lang;
      document.title = t['page-title'];

      document.querySelectorAll('.lang-switcher a').forEach(a => a.classList.remove('active'));
      document.getElementById(`lang-${lang}`).classList.add('active');
    }

    async function switchLang(lang) {
      currentLang = lang;
      const data = await loadTranslation(lang);
      applyTranslation(data, lang);
    }

    // Preload both languages
    loadTranslation('en');
    loadTranslation('es');
  </script>
</body>
</html>
